[build]
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
# Linker script is generated by build.rs from linker.ld.in — the
# platform-* feature picks the load address substituted into it.
rustflags = [
    "-C", "relocation-model=static",
    "-C", "target-cpu=cortex-a53",
    "-C", "force-frame-pointers=yes",
]
runner = "scripts/run-qemu.sh"

[unstable]
# (no unstable features in use; stable toolchain)
