[build]
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
# Linker script is selected by build.rs based on the platform-* feature
# (linker.ld for raspi3b, linker-fvp.ld for fvp-base).
rustflags = [
    "-C", "relocation-model=static",
    "-C", "target-cpu=cortex-a53",
    "-C", "force-frame-pointers=yes",
]
runner = "scripts/run-qemu.sh"

[unstable]
# (no unstable features in use; stable toolchain)
