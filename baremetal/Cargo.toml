[package]
name = "newton-hypervisor"
version = "0.0.1"
edition = "2021"
default-run = "newton-hypervisor"
license = "GPL-2.0-or-later"
description = "Bare-metal hypervisor for running Newton 2.x ROMs natively on Cortex-A53 Raspberry Pi."

[[bin]]
name = "newton-hypervisor"
path = "src/main.rs"

[features]
default = ["platform-raspi3b", "rom-717006", "log_traps", "log_irqs", "log_host_io", "diag"]

# Guest-ROM-version selection. Exactly one must be enabled; build.rs
# panics otherwise (mirrors the platform-* axis). The selected feature
# picks the `src/newton/rom_ver/` constants module (code addresses,
# kernel globals, probe PCs, ROM-tail placement budgets) and the
# build-time inputs (ROM image path, REx path, symbol tables, flash
# filename) via `resolve_rom_version()` in build.rs.
#
#   rom-717006 — MP2100 US, the fully-supported version. Inputs stay
#                at their historical locations (roms/newton.rom,
#                ../_Data_/Einstein.rex, ../_Data_/symbols.txt); a
#                per-version override at roms/717006/newton.rom is
#                honoured when present.
#   rom-710031 — skeleton seam-proof: Tier-1 constants only, all
#                probe/patch groups None/empty, no ROM image checked
#                in. Compiles (build.rs stages a zero-length ROM
#                placeholder); booting halts loudly in the loader.
rom-717006 = []
rom-710031 = []

# Diagnostics layer (src/diag/): trap histograms, task/heap dumps, REP
# output rendering, guest breakpoints, the ROM symbol tables backing
# PC→name lookup (and, via `trace`, the tracer). ON by default and in
# every `pi-bare-metal*` aggregate — real-hw debugging is the current
# workflow, so the gate exists as a layer boundary, not a size trim.
# With the feature off, `src/diag/mod.rs` swaps in no-op stubs with the
# identical surface: loud halts still dump basic trap context and park
# (correctness surface), but the kernel-aware rendering, histograms,
# task dumps, REP decoding, guest breakpoints, and the ~743 KiB
# symbol-table rodata drop out (build.rs also skips staging the symbol
# blobs). build.rs emits `cfg(nh_diag)`; source never reads the feature
# directly. Pulls in `newton-objects` (heap_check is its only consumer).
diag = ["dep:newton-objects"]

# Per-category log feature gates. The `default` set carries only the
# low-volume "is it making progress / are IRQs flowing / is host I/O
# alive" tier (log_traps, log_irqs, log_host_io); the high-volume
# investigation tiers (log_mmu, log_unaligned, log_tasks, log_store)
# are opt-in when chasing a specific class of stall. All are OFF for
# the `pi-bare-metal-*` aggregates so real-hardware boots stay quiet.
# Add a feature with `--features log_unaligned` or, alongside an
# aggregate, `--no-default-features --features "pi-bare-metal-input
# log_traps"`. log_traps/log_irqs/log_unaligned/log_host_io wrap
# kprintln via the `log_*!` macros in `src/uart.rs`; log_mmu /
# log_tasks / log_store gate whole diagnostic bodies via `#[cfg]`.
#
# Category coverage:
#   log_mmu       — stage-1 diagnostic dumps: `dump_guest_l1_table` /
#                   `dump_l1_neighbourhood` (used by the DABT section-
#                   fault path to eyeball lazy L1 descriptor shapes).
#   log_traps     — bulk trap-handler diagnostics: progress beacon
#                   every 10k traps, trap-frequency histogram every
#                   2s, the FME-entry / DAH-OR probes patched into
#                   specific kernel exception sites.
#   log_tasks     — `task_dump::periodic`: the ~4 s run-queue +
#                   current-task chain dump (30+ lines per fire).
#   log_irqs      — timer-IRQ heartbeat (ELR/SPSR/SP_svc/LR_svc
#                   sampling) plus post-budget tablet NativeGetSample
#                   entry/return logs.
#   log_unaligned — `src/unaligned.rs` per-fault decode of every
#                   AArch32 unaligned LDR/STR fixup, including ROM-
#                   patched ldrh/strh and ldrd targets.
#   log_store     — StorePermObject entry + LoadPermObject return
#                   probes: pretty-printed Ref at each flash-store
#                   round-trip. Instrumentation only — the gated ROM
#                   patches replace one instruction per site with an
#                   HVC whose handler emulates that instruction
#                   exactly, so guest semantics are identical either
#                   way. The patched ROM bytes do change the snapshot
#                   ROM fingerprint: snapshots saved with log_store on
#                   cold-boot with it off, and vice versa (same rule
#                   as `trace`).
#   log_host_io   — host_io backend diagnostics: SYS_OPEN status at
#                   init, every pump_input drain summary, pen-down/up
#                   edges, power-switch presses, pi_fb adoption of the
#                   splash framebuffer.
log_mmu = []
log_traps = []
log_tasks = []
log_irqs = []
log_unaligned = []
log_store = []
log_host_io = []

# Host-platform selection. Exactly one must be enabled; build.rs panics
# otherwise. Controls UART/GIC addresses, MMU memory map, load address
# (via linker script selection), and timer-IRQ routing. The AArch32
# guest ISA and the guest's simulated Newton hardware are unaffected.
platform-raspi3b = []
platform-fvp-base = []

# Host display + tablet-input backend. Opt-in only — at most one may be
# enabled. If none are enabled, build.rs picks "null" (so a bare
# `cargo run` works) and `cargo run --features host-io-semihost`
# switches without needing `--no-default-features`. Source code reads
# `#[cfg(nh_host_io_*)]`, not the feature directly. See
# `src/host_io/mod.rs`.
#
#   host-io-null     — no display sink, no input source. Default;
#                      used by guest-tests and CI runs.
#   host-io-semihost — forward blits to `/tmp/newton-host-io/out`,
#                      drain pen events from `/tmp/newton-host-io/in`
#                      via Arm semihosting. Paired with the
#                      `tools/host-viewer` Rust crate. Use for
#                      interactive QEMU / FVP sessions.
host-io-null = []
host-io-semihost = []
# VC-framebuffer backend for the Pi Zero 2 W. Renders Newton's
# 320x480 2 bpp framebuffer into the HDMI panel through the
# allocator built in src/display/. See src/host_io/pi_fb.rs.
# Implies platform-raspi3b: the backend renders through
# src/host/display, which only exists on that platform.
host-io-pi-fb = ["platform-raspi3b"]

# Persistent flash-store backend. Opt-in only — at most one may be
# enabled. If none are enabled, build.rs picks "semihost" (so a bare
# `cargo run` persists flash across cold boots). `nh_guest_test` mode
# always overrides to "null" for hermetic test runs. Source code reads
# `#[cfg(nh_flash_persist_*)]`. See `src/flash_persist/mod.rs`.
#
#   flash-persist-null     — no-op; flash is volatile.
#   flash-persist-semihost — read/write `$HOME/.newton/flash.bin` via
#                            Arm semihosting.
flash-persist-null = []
flash-persist-semihost = []
# Real-hardware backend: persists GUEST_FLASH to NEWTON.BIN on the
# FAT32 boot partition via the embedded-sdmmc + BCM2835 SDHOST stack
# built up in src/sd. Selected by the `pi-bare-metal-sd` aggregate.
# Implies platform-raspi3b: the backend drives the BCM2835 SDHOST
# in src/host/sd, which only exists on that platform.
flash-persist-sd = ["platform-raspi3b"]

# Pen-input backend. Opt-in only — at most one may be enabled. If
# none are enabled, build.rs picks "null" (no input source; QEMU/FVP
# get their pen events through the host_io-semihost backend, which
# is independent of this axis). Source code reads
# `#[cfg(nh_input_*)]`. See `src/input/mod.rs`.
#
#   input-null   — no pen source. Default; QEMU/FVP routes input
#                  through host_io-semihost; real-hw builds without
#                  the touchscreen just stay mute.
#   input-mtouch — TSTP MTouch USB digitizer (VID 0x0416 / PID
#                  0xC168) over the BCM2710 DWC2 OTG controller.
#                  Polled from the timer IRQ tail. Selected by the
#                  `pi-bare-metal-input` aggregate.
input-null = []
input-mtouch = []

# Host audio backend. Opt-in only — at most one may be enabled. If
# none are enabled, build.rs picks "null" (no host audio output).
# Source code reads `#[cfg(nh_audio_*)]`. See `src/audio/mod.rs`.
#
#   audio-null    — no host audio output. Default; QEMU/FVP and any
#                   real-hw build that doesn't include the HDMI
#                   driver. The Newton sound code is still
#                   exercised — buffers are just dropped.
#   audio-pi-hdmi — VC4 HDMI MAI audio injector at 0x3F90_2000.
#                   Encodes Newton PCM to IEC 60958 (SPDIF) subframes
#                   and pokes them into the HDMI block's audio FIFO;
#                   the VC firmware embeds the subframes into the
#                   video blanking interval. Requires
#                   `hdmi_drive=2` in config.txt to enable HDMI
#                   audio at the firmware level. Selected by the
#                   `pi-bare-metal-audio` aggregate (and rolled into
#                   `pi-bare-metal-input` so real-hw builds with the
#                   touchscreen also get sound). Implies
#                   platform-raspi3b: the backend pokes the VC4 HDMI
#                   block through src/host/mailbox, which only exists
#                   on that platform.
audio-null = []
audio-pi-hdmi = ["platform-raspi3b"]

# Disable every in-tree call to Arm semihosting (HLT #0xF000). Required
# when running on real silicon, where no semihosting host is listening:
#
#   - `uart::Writer` routes through PL011 `write_byte` instead of
#     `SYS_WRITE` to `:tt`. PL011 must be initialised first (it is, by
#     `uart::init`). Bytes pre-init are silently dropped.
#   - `snapshot.rs` skips init, autosave, and load (no /tmp/* host fs).
#   - `peripherals::vic::init_calendar` uses a hardcoded boot epoch
#     instead of SYS_TIME.
#   - `cpu::halt` skips SYS_EXIT_EXTENDED and falls through to WFE.
#
# Source code reads `cfg(feature = "no-semihost")` directly. Orthogonal
# to platform-* and to the host-io-* / flash-persist-* axes — pick the
# right backends explicitly alongside.
no-semihost = []

# Aggregate feature for "build for a real Pi Zero 2 W": same SoC as
# QEMU raspi3b (so platform-raspi3b is fine), no semihosting host, no
# host-fs-backed flash. host-io defaults to null already, so it's
# omitted here. Build with:
#   cargo build --release --no-default-features --features pi-bare-metal
pi-bare-metal = ["platform-raspi3b", "rom-717006", "no-semihost", "flash-persist-null", "diag"]

# Real-Pi build with persistent flash backed by the SD card's FAT32
# boot partition. Identical to `pi-bare-metal` except the flash
# backend is `sd` instead of `null`. Build:
#   cargo build --release --no-default-features \
#     --features pi-bare-metal-sd
pi-bare-metal-sd = ["platform-raspi3b", "rom-717006", "no-semihost", "flash-persist-sd", "diag"]

# Full real-Pi build: SD-backed flash + HDMI framebuffer output.
# Newton boots and paints to a mini-HDMI monitor. Pen input is
# still unwired (Phase 5).
pi-bare-metal-display = [
    "platform-raspi3b",
    "rom-717006",
    "no-semihost",
    "flash-persist-sd",
    "host-io-pi-fb",
    "diag",
]

# Real-Pi build with full display + TSTP MTouch USB touch panel.
# Adds the DWC2 host-controller driver and the MTouch device
# driver on top of pi-bare-metal-display. Build:
#   cargo build --release --no-default-features \
#     --features pi-bare-metal-input
pi-bare-metal-input = [
    "platform-raspi3b",
    "rom-717006",
    "no-semihost",
    "flash-persist-sd",
    "host-io-pi-fb",
    "input-mtouch",
    "audio-pi-hdmi",
    "diag",
]

# Real-hardware SDHOST bring-up probe. When enabled, kmain stops
# immediately after MMU + vectors are up, runs the BCM2835 SDHOST
# driver against the micro-SD slot (CMD0/CMD8/ACMD41/CMD2/CMD3/CMD9/
# CMD7), reads sector 0, dumps the MBR signature + partition table,
# and halts. Intended as the first-light test for src/sd; no other
# boot state runs after the probe, so the serial output reflects
# just SDHOST behaviour.
#
# Pair with pi-bare-metal for a real-Pi build:
#   cargo build --release --no-default-features \
#     --features "pi-bare-metal sd-probe"
# Implies no-semihost + platform-raspi3b: the probe drives the
# real-hardware BCM2835 DMA path (`nh_real_hw`).
sd-probe = ["no-semihost", "platform-raspi3b"]

# Real-hardware VC-framebuffer first-light probe. When on, kmain
# allocates a framebuffer at the panel's native size, paints a
# red→green horizontal gradient, and halts. Use for checking that
# the mailbox FB path works on a real Pi + monitor. Mutually
# exclusive in practice with sd-probe (both halt at the end of
# their kmain branch); build with one feature or the other.
#
#   cargo build --release --no-default-features \
#     --features "pi-bare-metal fb-probe"
fb-probe = []

# Function-level execution trace (every-call). When enabled, ROM load
# installs a 5-word trampoline per function in a reserved ROM-aperture
# window: the function's first word is rewritten to `B trampoline`, and
# the slot issues `HVC #TRACE_TAG` (logging the name + r0..r3 at entry),
# runs the original first instruction, then branches back. A function
# called ten times produces ten trace lines. The symbol address/name
# tables it consults are staged by build.rs whenever `diag` is on
# (they also back PC→name lookup in halt-path stack traces); this
# feature only turns on the trampoline install in `tracer::init`. See the module doc
# in `src/tracer.rs`. Off by default because the install mutates many
# ROM words, which changes the snapshot ROM fingerprint and forces a
# cold boot. Requires `diag` for the symbol tables the trampoline
# install consults.
trace = ["diag"]

# First-touch variant of `trace`: the main `trace SEQ PC NAME (mode)
# r0..r3` line is emitted once per function per session, gated on a
# per-function fired-bitmap in `log_trace_at`. The trampolines still
# fire on every call, so targeted side-effects in `tracer::log_trace_at`
# (putc line-buffering, the `SVC_WATCH` banked-SP/LR probe) keep working.
# Use when you want to see *which* functions execute without the
# loop-spam from re-entries. Implies `trace`.
trace_once = ["trace"]

# Silence recurring diagnostic logs that dominate the console during
# phase-B development (stage-1 XN re-walks on every MMU toggle, etc.).
# Off by default; enable with `--features quiet` alongside `trace` to
# get a clean function-trace log.
quiet = []

# NewtonScript-level tracing — opens the kernel's TInterpreter
# trace gates so every NS-level `DoSend / DoMessage / DoFastApply`
# emits a `Print` call describing the call. Two ROM-side pieces:
#
#   1. Patch `TraceSetOptions__12TInterpreterFv` at 0x35e7d8: its
#      `teq r0, #2` (Ref == NIL) check on `gVars.tracing` never
#      matches a real Ref — the function falls through to the
#      setup-with-defaults branch, opening the +104/+105/+108/
#      +112/+116 gates that `TraceSend / TraceCall / TraceApply /
#      TraceMethod` consult before reaching `Print`.
#   2. Runtime poke of `gInterpreter[+124] = 1` from
#      `heap_check::force_interpreter_trace_on` so the trace
#      funnels actually fire.
#
# This feature only enables the *gating* — it does not affect the
# output path. ROM debug output (POutTranslator → PHammerOutTranslator
# Print/Putc/Flush/StackTrace/ExceptionNotify) is always routed to
# the EL2 UART by the always-on body patches in
# `rom_patches::apply_pouttranslator_patches`.
#
# Off by default because TInterpreter trace produces a lot of
# output. Toggling rewrites a ROM word, which invalidates older
# snapshots — cold-boot on toggle (`rm -f /tmp/newton-snapshot-*.bin`).
ns_trace = []

[dependencies]
# NS Ref tag decoding for `diag::heap_check`'s pretty-printer — the
# only consumer, so the dep is optional and pulled in by the `diag`
# feature.
newton-objects = { path = "newton-objects", optional = true }
# FAT12/16/32 read+write for the Pi Zero 2 W's SD-card boot partition.
# no_std, no_alloc, statically sized (defaults: 4 dirs / 4 files / 1
# volume); see src/sd for the BCM2835 SDHOST block-device shim. Only
# referenced from #[cfg(feature = "platform-raspi3b")] code, but Cargo
# can't conditionally pull deps the way it gates `mod`s, so this
# compiles on every target. The crate itself is no_std-compatible.
embedded-sdmmc = { path = "vendor/embedded-sdmmc", default-features = false }

[profile.dev]
panic = "abort"
opt-level = 1
debug = 2

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = 2
strip = false
