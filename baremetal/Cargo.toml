[package]
name = "newton-hypervisor"
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Bare-metal hypervisor for running Newton 2.x ROMs natively on Cortex-A53 Raspberry Pi."

[[bin]]
name = "newton-hypervisor"
path = "src/main.rs"

[features]
default = ["platform-raspi3b"]

# Host-platform selection. Exactly one must be enabled; build.rs panics
# otherwise. Controls UART/GIC addresses, MMU memory map, load address
# (via linker script selection), and timer-IRQ routing. The AArch32
# guest ISA and the guest's simulated Newton hardware are unaffected.
platform-raspi3b = []
platform-fvp-base = []

# Function-level execution trace. When enabled, build.rs parses
# ../_Data_/unified_symbols.tsv and embeds a compact address + name
# table; at ROM load time each word-aligned function entry whose first
# instruction matches a known ARM prologue is overwritten with
# `UDF #index` (0xE7F1_xxxx) and the original word is stashed in an
# EL2-side table. The UND handler logs the function name, restores
# the original instruction, invalidates the icache line, and rewinds
# ELR — so each function logs once per boot ("first-touch" trace).
# Off by default because the symbol blob adds ~400 KiB to the image
# and mutates the ROM in ways that invalidate existing snapshots.
trace = []

# First-touch variant of `trace`: each function logs its entry line
# once per session. The trampolines still fire on every call (so the
# targeted debug instrumentation in `tracer::log_trace_at` — putc
# buffering, newt-tripwire poll, mode-13 SP_svc tracking, etc. — keeps
# working), but the main `trace SEQ PC NAME (mode) r0..r3 lr=...` line
# is gated on a per-function fired-bitmap. Use when you want to see
# *which* functions execute without the loop-spam from re-entries.
# Implies `trace`.
trace_once = ["trace"]

# Silence recurring diagnostic logs that dominate the console during
# phase-B development (stage-1 XN re-walks on every MMU toggle, etc.).
# Off by default; enable with `--features quiet` alongside `trace` to
# get a clean function-trace log.
quiet = []

# NewtonScript-level tracing — opens the kernel's TInterpreter
# trace gates so every NS-level `DoSend / DoMessage / DoFastApply`
# emits a `Print` call describing the call. Two ROM-side pieces:
#
#   1. Patch `TraceSetOptions__12TInterpreterFv` at 0x35e7d8: its
#      `teq r0, #2` (Ref == NIL) check on `gVars.tracing` never
#      matches a real Ref — the function falls through to the
#      setup-with-defaults branch, opening the +104/+105/+108/
#      +112/+116 gates that `TraceSend / TraceCall / TraceApply /
#      TraceMethod` consult before reaching `Print`.
#   2. Runtime poke of `gInterpreter[+124] = 1` from
#      `heap_check::force_interpreter_trace_on` so the trace
#      funnels actually fire.
#
# This feature only enables the *gating* — it does not affect the
# output path. ROM debug output (POutTranslator → PHammerOutTranslator
# Print/Putc/Flush/StackTrace/ExceptionNotify) is always routed to
# the EL2 UART by the always-on body patches in
# `rom_patches::apply_pouttranslator_patches`.
#
# Off by default because TInterpreter trace produces a lot of
# output. Toggling rewrites a ROM word, which invalidates older
# snapshots — cold-boot on toggle (`rm -f /tmp/newton-snapshot-*.bin`).
ns_trace = []
# Layered on top of `ns_trace`: change the first store of the
# TInterpreter trace-mode field at 0x35e7ec from `mov r0, #2` to
# `mov r0, #3`. The field at TInterpreter+0x7C selects which
# family of trace events fires; the EQRef/symbol-match branch
# later in the same function already writes 3 for one specific
# symbol, so 3 is a value the downstream gates already handle.
# Use when `ns_trace`'s default mode (#2) isn't surfacing the
# events you want and you'd rather start from the broader #3
# default.
full_ns_trace = ["ns_trace"]

[dependencies]
newton-objects = { path = "newton-objects" }

[profile.dev]
panic = "abort"
opt-level = 1
debug = 2

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = 2
strip = false
