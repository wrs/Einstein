[package]
name = "newton-hypervisor"
version = "0.0.1"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Bare-metal hypervisor for running Newton 2.x ROMs natively on Cortex-A53 Raspberry Pi."

[[bin]]
name = "newton-hypervisor"
path = "src/main.rs"

[features]
default = ["platform-raspi3b"]

# Host-platform selection. Exactly one must be enabled; build.rs panics
# otherwise. Controls UART/GIC addresses, MMU memory map, load address
# (via linker script selection), and timer-IRQ routing. The AArch32
# guest ISA and the guest's simulated Newton hardware are unaffected.
platform-raspi3b = []
platform-fvp-base = []

# Function-level execution trace. When enabled, build.rs parses
# ../_Data_/unified_symbols.tsv and embeds a compact address + name
# table; at ROM load time each word-aligned function entry whose first
# instruction matches a known ARM prologue is overwritten with
# `UDF #index` (0xE7F1_xxxx) and the original word is stashed in an
# EL2-side table. The UND handler logs the function name, restores
# the original instruction, invalidates the icache line, and rewinds
# ELR — so each function logs once per boot ("first-touch" trace).
# Off by default because the symbol blob adds ~400 KiB to the image
# and mutates the ROM in ways that invalidate existing snapshots.
trace = []

# Silence recurring diagnostic logs that dominate the console during
# phase-B development (stage-1 XN re-walks on every MMU toggle, etc.).
# Off by default; enable with `--features quiet` alongside `trace` to
# get a clean function-trace log.
quiet = []

# Enable the deferred `shadow_stub::validate_against_probe` helper
# (compares our translator against a golden PC list from the probe).
# Off by default; the helper is wired up but not yet invoked.
validate_with_probe = []

[profile.dev]
panic = "abort"
opt-level = 1
debug = 2

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = 2
strip = false
