[build]
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
# Linker script is passed by build.rs (nhboot/linker.ld). Same
# code-generation flags as the hypervisor's .cargo/config.toml so the
# two binaries share one ABI assumption set (static, Cortex-A53 —
# which also enables the CRC32 instructions crc.rs relies on).
rustflags = [
    "-C", "relocation-model=static",
    "-C", "target-cpu=cortex-a53",
    "-C", "force-frame-pointers=yes",
]
