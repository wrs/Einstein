# rust-analyzer project config.
#
# main.rs uses `#![cfg_attr(not(test), no_std)]` so the crate is no_std on
# aarch64-unknown-none-softfloat (the build/run target) but would be std
# under cfg(test) on a host triple.
#
# rust-analyzer defaults to `cfg.set_test = true` and `cargo.all_targets =
# true`, which forces cfg(test) on while checking against the bare-metal
# target — producing hundreds of bogus "can't find crate for `std`" errors.
# Turning both off makes rust-analyzer match the actual baremetal build.
[cargo]
allTargets = false

[cfg]
setTest = false
